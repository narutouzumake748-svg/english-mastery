<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Mastery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f7f4ef;--card:#fff;--alt:#eeebe4;--text:#1c1c2e;--muted:#6b6a7a;--border:#dedad2;--accent:#c97a12;--al:#fdf0dc;--blue:#2e6a9e;--bl:#e6f0f8;--green:#2a7a4e;--gl:#e4f2ea;--red:#c0392b;--rl:#fdecea;--purple:#6b3fa0;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1120;--card:#161c35;--alt:#1e2440;--text:#e8e4dc;--muted:#9090a8;--border:#2a3050;--accent:#f0a030;--al:#3a2a10;--blue:#5b92c8;--bl:#152030;--green:#3aaa6a;--gl:#102818;--red:#e05545;--rl:#2a1010;--purple:#9b6ee0;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1120;--card:#161c35;--alt:#1e2440;--text:#e8e4dc;--muted:#9090a8;--border:#2a3050;--accent:#f0a030;--al:#3a2a10;--blue:#5b92c8;--bl:#152030;--green:#3aaa6a;--gl:#102818;--red:#e05545;--rl:#2a1010;--purple:#9b6ee0;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
button{-webkit-appearance:none;appearance:none}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.7}
.screen{display:none;min-height:100vh;padding-bottom:2rem}
.screen.active{display:block}
/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1rem 1rem .75rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.hdr-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700}
.hdr-sub{font-size:.72rem;color:var(--muted)}
.theme-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back-btn{background:none;border:none;color:var(--blue);cursor:pointer;font-size:.9rem;font-weight:600;padding:.25rem .5rem .25rem 0;display:flex;align-items:center;gap:.3rem}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;padding:1rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem;text-align:center}
.stat-n{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--accent)}
.stat-l{font-size:.72rem;color:var(--muted);font-weight:500}
/* Grid */
.grid-wrap{padding:0 1rem 1rem}
.grid-label{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.6rem}
.day-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}
.day-btn{width:100%;height:0;padding-bottom:100%;border-radius:50%;border:2px solid var(--border);background:var(--alt);font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted);position:relative;transition:all .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.day-btn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.day-btn.done-good{background:var(--gl);border-color:var(--green);color:var(--green)}
.day-btn.done-ok{background:var(--al);border-color:var(--accent);color:var(--accent)}
.day-btn.current{background:var(--bl);border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(46,106,158,.2)}
.continue-wrap{padding:0 1rem 1rem}
.btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:.85rem;font-size:1rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-primary:hover{opacity:.9}
.btn-sec{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.75rem;font-size:.9rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;width:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Day view */
.day-hdr{padding:1rem;border-bottom:1px solid var(--border)}
.day-tag{display:inline-block;background:var(--bl);color:var(--blue);font-size:.72rem;font-weight:600;padding:.2rem .7rem;border-radius:100px;margin-bottom:.5rem;letter-spacing:.04em}
.day-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700}
.day-body{padding:1rem}
.concept-box{background:var(--bl);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:.9rem 1rem;margin-bottom:1rem;font-size:.92rem}
.pattern-box{background:var(--alt);border:1px dashed var(--border);border-radius:8px;padding:.9rem 1rem;font-family:'Courier New',monospace;font-size:.82rem;line-height:1.9;white-space:pre-wrap;margin-bottom:1rem}
.rw-pair{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem}
.rw-wrong{background:var(--rl);border:1px solid var(--red);border-radius:7px;padding:.6rem .8rem;font-size:.82rem}
.rw-right{background:var(--gl);border:1px solid var(--green);border-radius:7px;padding:.6rem .8rem;font-size:.82rem}
.rw-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;margin-bottom:.2rem}
.rw-lbl.w{color:var(--red)}.rw-lbl.r{color:var(--green)}
.quiz-btn-wrap{padding:1rem;position:sticky;bottom:0;background:var(--bg)}
/* Quiz */
.quiz-hdr{padding:1rem;border-bottom:1px solid var(--border)}
.progress-bar{background:var(--alt);border-radius:100px;height:6px;margin:.6rem 0 .25rem}
.progress-fill{background:var(--accent);height:6px;border-radius:100px;transition:width .3s}
.q-count{font-size:.78rem;color:var(--muted)}
.q-body{padding:1rem}
.q-text{font-size:1.05rem;font-weight:600;line-height:1.5;margin-bottom:1.2rem}
.opts{display:grid;gap:.6rem}
.opt-btn{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:.8rem 1rem;text-align:left;font-size:.9rem;cursor:pointer;font-family:'Inter',sans-serif;color:var(--text);transition:all .15s;display:flex;align-items:center;gap:.75rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation;width:100%}
.opt-btn .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--alt);font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt-btn:hover:not(:disabled){border-color:var(--blue);background:var(--bl)}
.opt-btn.correct{border-color:var(--green);background:var(--gl)}
.opt-btn.correct .opt-letter{background:var(--green);color:#fff}
.opt-btn.wrong{border-color:var(--red);background:var(--rl)}
.opt-btn.wrong .opt-letter{background:var(--red);color:#fff}
.opt-btn:disabled{cursor:default}
.exp-box{background:var(--al);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:.8rem 1rem;margin-top:1rem;font-size:.88rem;display:none}
.next-wrap{padding:1rem;position:sticky;bottom:0;background:var(--bg)}
/* Results */
.result-body{padding:1.5rem 1rem;text-align:center}
.score-circle{width:110px;height:110px;border-radius:50%;background:var(--card);border:4px solid var(--accent);margin:0 auto 1rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-n{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--accent)}
.score-d{font-size:.78rem;color:var(--muted)}
.score-msg{font-size:1.1rem;font-weight:600;margin-bottom:.5rem}
.stars{font-size:1.4rem;margin-bottom:1.5rem;letter-spacing:.1em}
.review-title{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;margin-bottom:.75rem}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;margin-bottom:.6rem;text-align:left;font-size:.88rem}
.review-q{font-weight:600;margin-bottom:.3rem}
.review-correct{color:var(--green);font-size:.85rem}
.result-btns{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.5rem}
/* Tip box */
.tip-box{background:var(--al);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:.8rem 1rem;margin-bottom:1rem;font-size:.88rem}
/* Score bar */
.score-bar{background:var(--alt);border-radius:8px;padding:.75rem 1rem;font-size:.82rem;color:var(--muted);text-align:center;margin-top:.5rem}
/* Responsive */
@media(max-width:400px){.day-grid{grid-template-columns:repeat(5,1fr)}.rw-pair{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- DASHBOARD -->
<div id="s-dash" class="screen active">
  <div class="hdr">
    <div><div class="hdr-title">English Mastery</div><div class="hdr-sub">30-Day Native Speaker Program</div></div>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-n" id="stat-done">0</div><div class="stat-l">Days Done</div></div>
    <div class="stat"><div class="stat-n" id="stat-streak">0</div><div class="stat-l">Day Streak</div></div>
    <div class="stat"><div class="stat-n" id="stat-avg">—</div><div class="stat-l">Avg Score</div></div>
  </div>
  <div class="grid-wrap">
    <div class="grid-label">Your 30 Days</div>
    <div class="day-grid" id="day-grid"></div>
  </div>
  <div class="continue-wrap">
    <button class="btn-primary" onclick="continueLearning()">Continue Learning →</button>
  </div>
</div>

<!-- DAY VIEW -->
<div id="s-day" class="screen">
  <div class="hdr">
    <button class="back-btn" onclick="showScreen('s-dash')">← Back</button>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="day-hdr">
    <div class="day-tag" id="dv-tag"></div>
    <div class="day-title" id="dv-title"></div>
  </div>
  <div class="day-body" id="dv-body"></div>
  <div class="quiz-btn-wrap">
    <button class="btn-primary" onclick="startQuiz(currentDay)">Take Quiz →</button>
  </div>
</div>

<!-- QUIZ -->
<div id="s-quiz" class="screen">
  <div class="hdr">
    <button class="back-btn" onclick="showScreen('s-day')">← Day</button>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="quiz-hdr">
    <div class="progress-bar"><div class="progress-fill" id="q-fill" style="width:20%"></div></div>
    <div class="q-count" id="q-count">Question 1 of 5</div>
  </div>
  <div class="q-body">
    <div class="q-text" id="q-text"></div>
    <div class="opts" id="q-opts"></div>
    <div class="exp-box" id="q-exp"></div>
  </div>
  <div class="next-wrap" id="next-wrap" style="display:none">
    <button class="btn-primary" onclick="nextQ()">Next →</button>
  </div>
</div>

<!-- RESULTS -->
<div id="s-results" class="screen">
  <div class="hdr">
    <div class="hdr-title">Quiz Complete</div>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="result-body">
    <div class="score-circle"><div class="score-n" id="r-score"></div><div class="score-d">out of 5</div></div>
    <div class="stars" id="r-stars"></div>
    <div class="score-msg" id="r-msg"></div>
    <div id="r-review"></div>
    <div class="result-btns">
      <button class="btn-sec" onclick="retakeQuiz()">Retake</button>
      <button class="btn-primary" onclick="nextDay()">Next Day →</button>
    </div>
  </div>
</div>

<script>
// ── DAYS DATA ──────────────────────────────────────────────────
const DAYS={
1:{title:"IN / ON / AT — Space",tag:"Prepositions · Day 1",concept:"Think of these like zoom levels on a map. IN = inside a container or enclosed space. ON = touching a surface from above. AT = a precise point — like a pin drop on a map.",pattern:`IN:  in a room · in a car · in India · in the sky · in a drawer
ON:  on a table · on a bus · on the third floor · on the wall
AT:  at the door · at work · at school · at the airport · at the top`,examples:[{w:"She is in the bus stop.",r:"She is AT the bus stop."},{w:"The keys are on the drawer.",r:"The keys are IN the drawer."},{w:"He lives in the third floor.",r:"He lives ON the third floor."}]},
2:{title:"TO / INTO / ONTO / OFF / OUT OF",tag:"Prepositions · Day 2",concept:"Yesterday was WHERE you are. Today is WHERE you're going. TO = direction toward a destination. INTO = entering a container. ONTO = landing on a surface. OFF = leaving a surface. OUT OF = exiting a container.",pattern:`TO:     I'm going TO school. (destination)
INTO:   She walked INTO the room. (entering)
ONTO:   He climbed ONTO the roof. (landing on surface)
OFF:    Get OFF the bus! (leaving surface)
OUT OF: She came OUT OF the building. (exiting)`,examples:[{w:"He entered into the office.",r:"He walked INTO the office. ('Entered' already means 'went into')"},{w:"Jump on the car.",r:"Jump INTO the car. (you go inside a car)"}]},
3:{title:"IN / ON / AT — Time",tag:"Prepositions · Day 3",concept:"Same three words, same zoom logic — but for time. IN = big periods (years, months, seasons, parts of day). ON = specific days and dates. AT = exact clock times.",pattern:`IN:  in 2024 · in January · in summer · in the morning · in the evening
ON:  on Monday · on Christmas Day · on March 5th · on the weekend
AT:  at 3pm · at noon · at midnight · at night · at the moment`,examples:[{w:"The meeting is in Monday.",r:"The meeting is ON Monday."},{w:"She was born on 1995.",r:"She was born IN 1995."},{w:"The alarm rings on 6am.",r:"The alarm rings AT 6am."}]},
4:{title:"OVER / ABOVE / UNDER / BELOW",tag:"Prepositions · Day 4",concept:"OVER = movement, covering, or spanning across. ABOVE = simply higher than — no covering implied. UNDER = physically beneath, usually close. BELOW = lower than — often abstract (levels, scales).",pattern:`OVER:   flew over the city · put a blanket OVER him · control OVER the budget
ABOVE:  clouds are ABOVE us · ABOVE average · the flat ABOVE mine
UNDER:  cat is UNDER the table · UNDER pressure · UNDER the law
BELOW:  temperature BELOW zero · see note BELOW · BELOW average`,examples:[{w:"The temperature is over zero.",r:"The temperature is ABOVE zero. (abstract level)"},{w:"She put a sheet above the patient.",r:"She put a sheet OVER the patient. (covering)"}]},
5:{title:"A and AN — The 'Any One' Article",tag:"Articles · Day 5",concept:"A and AN both mean 'one of this thing — not specific, any one will do.' The ONLY rule: sound, not spelling. AN before vowel SOUNDS. A before consonant SOUNDS. Say the next word out loud — your ears decide.",pattern:`A  → consonant sounds:  a cat · a university (yoo-ni) · a European (yur-)
AN → vowel sounds:      an apple · an hour (silent H) · an MBA (em-bee-ay)
AN → vowel sounds:      an X-ray · an honest man · an electric car`,examples:[{w:"She is doctor.",r:"She is A doctor."},{w:"He's a honest person.",r:"He's AN honest person. (silent H → vowel sound)"},{w:"It was a unique opportunity.",r:"Correct! (yoo-neek = consonant sound → A)"}]},
6:{title:"THE vs No Article",tag:"Articles · Day 6",concept:"THE = both speaker and listener know exactly which one. No article = talking about something in general, or a category as a whole. The question to ask: 'Are we both picturing the SAME specific one?' Yes → THE. No → a or nothing.",pattern:`THE:   Pass me THE salt. (on this table) · THE sun rises in the east.
THE:   She's THE best student. (superlative) · THE book you mentioned.
NONE:  I love music. · Dogs are loyal. · She goes to school. (activity)
NONE:  I had breakfast. · He plays football. · She speaks English.`,examples:[{w:"I had the breakfast this morning.",r:"I had breakfast this morning. (meal = no article)"},{w:"He is best student.",r:"He is THE best student. (superlative → THE)"},{w:"The life is beautiful.",r:"Life is beautiful. (general truth = no article)"}]},
7:{title:"Week 1 Mixed Review",tag:"Review · Day 7",concept:"This day combines everything from Week 1: space prepositions, movement prepositions, time prepositions, and articles. The quiz will randomly test any of these — no peeking at the previous days first!",pattern:`Space:  IN (container) · ON (surface) · AT (point)
Time:   IN (year/month) · ON (day/date) · AT (exact time)
Move:   TO (destination) · INTO (entering) · OFF (leaving surface)
Art:    A/AN (any one) · THE (specific known) · ø (general)`,examples:[{w:"I'll see you in Monday in noon.",r:"I'll see you ON Monday AT noon."},{w:"She is a honest engineer.",r:"She is AN honest engineer."}]},
8:{title:"Simple Past vs Present Perfect",tag:"Tenses · Day 8",concept:"Simple past: the action is finished — it's a closed chapter. Present perfect (have/has + past participle): the action happened in the past but is RELEVANT TO RIGHT NOW. Signal words for present perfect: ever, never, just, already, yet, since, for.",pattern:`Simple Past:      She lived in London.     (she doesn't now — closed)
Present Perfect:  She has lived in London. (she still does, or it matters now)

Simple Past:      I ate lunch.             (story over)
Present Perfect:  I've eaten lunch.        (relevant now — maybe you asked if I'm hungry)`,examples:[{w:"I have seen him yesterday.",r:"I SAW him yesterday. (specific past time → simple past)"},{w:"Did you ever try sushi?",r:"HAVE you ever tried sushi? ('ever' = present perfect)"}]},
9:{title:"Present Perfect Continuous",tag:"Tenses · Day 9",concept:"HAVE/HAS + BEEN + VERB-ING. This shows an ongoing action that started in the past and continues now — or just stopped but left a visible result. Use this when you want to emphasize DURATION or an ongoing process.",pattern:`"I've been working all day."      → started earlier, still going
"He's been crying."              → evidence visible NOW (red eyes)
"She's been living here since 2015." → started then, still true
vs. "I've read the report."     → done. Complete.
vs. "I've been reading all morning." → ongoing process, maybe unfinished`,examples:[{w:"I am working since morning.",r:"I HAVE BEEN WORKING since morning."},{w:"She tired because she work all night.",r:"She's tired because she HAS BEEN WORKING all night."}]},
10:{title:"Past Perfect",tag:"Tenses · Day 10",concept:"HAD + past participle. This is the 'past of the past.' You're telling a story in the simple past — and you need to jump back even further. Think of it like a flashback inside a flashback.",pattern:`"When I arrived, the party had already started."
  → arrived (past) | party started = even earlier (past perfect)

"She was angry because he had forgotten her birthday."
  → angry (past) | forgetting = even earlier (past perfect)`,examples:[{w:"When I arrived, the meeting already started.",r:"When I arrived, the meeting HAD ALREADY STARTED."},{w:"She passed because she studied hard.",r:"She passed because she HAD STUDIED hard. (studying happened first)"}]},
11:{title:"Past Perfect Continuous",tag:"Tenses · Day 11",concept:"HAD + BEEN + VERB-ING. Like past perfect, but emphasizing the ongoing duration of the earlier action. Use this when you want to show that something was a running process BEFORE another past event — and its duration matters.",pattern:`"He was tired because he had been running."
  → running was ongoing BEFORE he was tired

"She had been studying for 5 hours before she took a break."
"By the time we arrived, they had been waiting for 2 hours."`,examples:[{w:"He was tired because he ran.",r:"He was tired because he HAD BEEN RUNNING. (emphasizes duration)"},{w:"When boss arrived, team argued for 20 minutes.",r:"When the boss arrived, the team HAD BEEN ARGUING for 20 minutes."}]},
12:{title:"All Four Perfects Compared",tag:"Tenses · Day 12",concept:"Present perfect (have/has) = past → NOW. Present perfect continuous (have/has been + -ing) = ongoing to NOW. Past perfect (had) = past of the past. Past perfect continuous (had been + -ing) = ongoing before a past point.",pattern:`have/has + p.p.         Past relevant to NOW       "I've finished."
have/has been + -ing    Ongoing to NOW             "I've been working."
had + p.p.              Past before past           "She had left."
had been + -ing         Ongoing before past point  "They had been waiting."`,examples:[{w:"By 2020, she has worked here for a decade.",r:"By 2020, she HAD WORKED here for a decade. (past reference point → past perfect)"},{w:"I'm tired — I worked all day.",r:"I'm tired — I'VE BEEN WORKING all day. (ongoing to now → present perfect continuous)"}]},
13:{title:"Common Tense Mistakes",tag:"Tenses · Day 13",concept:"These are the 5 mistakes that most consistently give away a non-native speaker. Learn to avoid these and your tense accuracy jumps immediately.",pattern:`Rule 1: Specific past time (yesterday/last week/in 2020) → ALWAYS simple past
Rule 2: ever/never/just/already/yet → ALMOST ALWAYS present perfect
Rule 3: he/she/it → HAS (not have) in present perfect
Rule 4: "ago" = specific past → simple past
Rule 5: "since" + point / "for" + duration → present perfect`,examples:[{w:"She have been working all day.",r:"She HAS been working all day. (she/he/it → HAS)"},{w:"We have moved here three years ago.",r:"We MOVED here three years ago. ('ago' = specific past)"}]},
14:{title:"Week 2 Mixed Review",tag:"Review · Day 14",concept:"All four perfect tenses tested together. The key question every time: Is this connected to NOW? Use present perfect. Is this the past of a past story? Use past perfect. Need to emphasize duration? Add been + -ing.",pattern:`Signal → Tense:
ever/never/just/already/yet → Present Perfect
for/since (to now) → Present Perfect / Present Perfect Continuous
by the time / when (in past story) → Past Perfect
for (before past point) → Past Perfect Continuous`,examples:[{w:"I never been to Japan.",r:"I have NEVER BEEN to Japan."},{w:"She was tired because she work all night.",r:"She was tired because she HAD BEEN WORKING all night."}]},
15:{title:"Word Stress",tag:"Speaking · Day 15",concept:"Every English word has one syllable that's stressed — said louder, longer, slightly higher. Getting stress wrong is more confusing to a native ear than a grammar mistake. The same word, stressed differently, changes meaning completely.",pattern:`Noun/Adjective → stress early:  REcord · PREsent · PROtest · PERfect
Verb → stress late:              reCORD · preSENT · proTEST · perFECT

-tion / -sion → stress syllable BEFORE it:
  inforMAtion · disCUSsion · atTENtion · eduCAtion

-ic → stress syllable BEFORE it:
  eLECtric · acaDEmic · speCIFic · elecTROnic`,examples:[{w:"She will PREsent the report tomorrow.",r:"She will preSENT the report. (verb → stress 2nd syllable)"},{w:"pho-TO-gra-phy? No—",r:"pho-TO-gra-phy ✓ (phoTOgraphy — stress shifts with suffix)"}]},
16:{title:"Sentence Stress",tag:"Speaking · Day 16",concept:"Natives don't stress every word equally. They stress CONTENT words (nouns, main verbs, adjectives, adverbs) and swallow FUNCTION words (articles, prepositions, pronouns, auxiliaries). This creates English rhythm — the reason natives seem to 'mumble' small words.",pattern:`STRESSED (content):    nouns · main verbs · adjectives · adverbs · negatives
UNSTRESSED (function): a/the · in/on/at · I/he/she · is/was/have · and/but

"I WENT to the STORE to BUY some MILK."
"She's been WORKING really HARD LATELY."
"Did you FINISH the REPORT?"`,examples:[{w:"stressing every word equally: 'I WENT TO THE STORE TO BUY SOME MILK.'",r:"Natural: 'I WENT to the STORE to BUY some MILK.' — content words carry the weight."}]},
17:{title:"Connected Speech",tag:"Speaking · Day 17",concept:"Natives link and compress words in casual speech. This isn't sloppiness — it's efficiency. You've already heard all of this in anime. Now you know what's happening and when to use each form.",pattern:`going to → gonna    "I'm gonna call you."
want to  → wanna    "Do you wanna come?"
got to   → gotta    "I gotta go."
kind of  → kinda    "That's kinda weird."
let me   → lemme    "Lemme think about it."

Linking: "pick it up" → "pic-ki-dup"
         "come on"    → "c'mon"
         "did you"    → "didja"`,examples:[{w:"Using 'gonna' in a formal presentation.",r:"Save reductions (gonna/wanna/gotta) for casual speech. Use full forms in formal contexts."},{w:"'whatcha' — I've heard this but what is it?",r:"'what are you' → 'whatcha' (linked + reduced). You've heard it in anime constantly."}]},
18:{title:"Intonation Patterns",tag:"Speaking · Day 18",concept:"Intonation is the rise and fall of your voice. Natives use it to signal whether they're done speaking, whether it's a question, and whether they're listing items. Gujarati speakers sometimes end statements with a slight rise — which sounds like a question to English ears.",pattern:`FALLING (↘) — statements, wh-questions, commands:
  "I'm going home." ↘  "Where are you going?" ↘  "Stop." ↘

RISING (↗) — yes/no questions, not finished yet:
  "Are you coming?" ↗  "I went to the store ↗ and then came home." ↘

LIST: rise on each item, fall on the last:
  "red ↗, white ↗, and blue ↘"`,examples:[{w:"Ending a statement with rising intonation.",r:"Statements should fall. Rising intonation on a statement sounds like a question or uncertainty."},{w:"'Where are you going?' said with rising intonation.",r:"Wh-questions FALL. 'Where are you going?' ↘ — this is a statement, not a question."}]},
19:{title:"Collocations",tag:"Vocabulary · Day 19",concept:"Natives don't just know words — they know word PARTNERSHIPS. Using the wrong verb with a noun sounds unnatural even when grammatically correct. 'Do a mistake' makes native ears flinch. Learn words as pairs, not individually.",pattern:`MAKE:  a mistake · a decision · a suggestion · an effort · progress
DO:    homework · research · business · someone a favour · your best
HAVE:  a meeting · a conversation · a break · a look · fun
TAKE:  a break · a risk · a seat · a photo · responsibility · notes

ADJECTIVE collocations:
heavy: rain/traffic/workload · strong: wind/coffee/argument`,examples:[{w:"Can you do a decision before Friday?",r:"Can you MAKE a decision before Friday?"},{w:"We need to make research first.",r:"We need to DO research first."}]},
20:{title:"Phrasal Verbs & Idioms",tag:"Vocabulary · Day 20",concept:"Phrasal verbs are verbs + prepositions that create a completely new meaning. Natives use them constantly. Formal writing uses Latin-based single words instead. You've heard all of these in anime — now you know what's happening.",pattern:`give up = quit          give away = accidentally reveal
figure out = understand  run out of = have no more
run into = meet by chance come across = find by chance
come up = arise unexpectedly  work out = exercise / turn out well

IDIOMS:
hit the nail on the head = said exactly the right thing
bite the bullet = endure something difficult
on the fence = undecided
once in a blue moon = very rarely`,examples:[{w:"'Give up' means to give something upward.",r:"No — 'give up' = QUIT. Phrasal verbs are new meanings. Learn them as single units."},{w:"'I'm on the fence about it.' — What does this mean?",r:"Undecided — you're sitting on the fence between two sides."}]},
21:{title:"Week 3 Mixed Review",tag:"Review · Day 21",concept:"All of Week 3 tested together: word stress, sentence stress, connected speech, intonation, collocations, phrasal verbs and idioms. Focus: would a native speaker say this naturally?",pattern:`Checklist:
✓ Stress the right syllable (noun/verb shift, -tion/-ic rules)
✓ Stress content words, swallow function words
✓ Formal = full forms · Casual = reductions (gonna/wanna)
✓ Statements fall · Yes/No questions rise
✓ MAKE a decision · DO research · TAKE a break · HAVE a meeting`,examples:[{w:"Can you make the research and do a decision by Monday?",r:"Can you DO the research and MAKE a decision by Monday?"},{w:"'Never have I seen such courage!' — what structure is this?",r:"Inversion for emphasis — very dramatic, very native. You've heard it in anime climaxes."}]},
22:{title:"Register & Tone",tag:"Fluency · Day 22",concept:"Register = the level of formality. Natives shift automatically depending on who they're talking to. Using casual language with a client, or overly formal language with friends, both feel wrong — even when the grammar is perfect.",pattern:`Same message, three registers:
Casual:      "Hold on a sec."
Semi-formal: "Could you give me a moment?"
Formal:      "Would you mind waiting briefly?"

Casual markers:   contractions (I'm/you're/it's) · phrasal verbs · short sentences
Formal markers:   no contractions · Latinate words · longer, hedged sentences
                  help → assist · start → commence · find out → discover`,examples:[{w:"Using 'gonna' in a client email.",r:"Formal writing = full forms. 'Going to' not 'gonna'. No contractions."},{w:"'I was wondering if you might be able to assist.' — too formal for chat?",r:"Yes — for a colleague chat, 'Can you help?' is more natural."}]},
23:{title:"Discourse Markers",tag:"Fluency · Day 23",concept:"Discourse markers are the connectors that show how your ideas relate. Without them, you sound choppy. With them, you sound fluent and logical. Natives use these automatically — now you'll use them deliberately.",pattern:`ADDING:      also · moreover · in addition · furthermore · on top of that
CONTRASTING: however · that said · although · on the other hand · even so
EXPLAINING:  because · therefore · as a result · that's why · so
CONCLUDING:  to sum up · all in all · ultimately · the bottom line is
HEDGING:     apparently · I believe · to my knowledge · as far as I know
THINKING:    well · I mean · to be honest · basically · you know`,examples:[{w:"That's a valid point. But I disagree.",r:"That's a valid point. THAT SAID, I'm not sure I agree. ('That said' is more sophisticated)"},{w:"She studied hard. She passed.",r:"She studied hard. THEREFORE, she passed. (shows cause and effect)"}]},
24:{title:"Conditionals",tag:"Fluency · Day 24",concept:"There are four types — but one logic: the more IMAGINARY the situation, the further back the tense goes. Real future = will. Imaginary present = would. Imaginary past = would have. Always use 'were' (not 'was') in second conditionals — even for I/he/she.",pattern:`Zero:  If + present, present        → always true: "If you heat water, it boils."
First: If + present, will           → real future: "If I study, I will pass."
Second:If + past, would             → imaginary: "If I were rich, I would travel."
Third: If + past perfect, would have→ past regret: "If I had studied, I would have passed."
Mixed: If + past perfect, would     → "If I had saved then, I would be rich now."`,examples:[{w:"If I was you, I would apologise.",r:"If I WERE you, I would apologise. (second conditional → subjunctive 'were' for all subjects)"},{w:"If she would study harder, she will pass.",r:"If she STUDIES harder, she WILL pass. (first conditional)"}]},
25:{title:"Passive Voice",tag:"Fluency · Day 25",concept:"Passive voice puts the focus on WHAT happened rather than WHO did it. Use it when the doer is unknown, unimportant, or when you want to sound more formal or diplomatic. Formal and scientific writing heavily uses passive.",pattern:`Active:  "The team completed the project."
Passive: "The project was completed (by the team)."

Use passive when:
✓ Doer is unknown:      "My wallet was stolen."
✓ Doer is irrelevant:   "The building was constructed in 1920."
✓ Diplomatic:           "Mistakes were made." (no blame)
✓ Formal/scientific:    "The data was analyzed over three months."`,examples:[{w:"They are investigated the issue.",r:"The issue IS BEING INVESTIGATED. (passive: the issue matters, not who's doing it)"},{w:"Someone built this bridge in 1950.",r:"This bridge WAS BUILT in 1950. (passive: the bridge matters, not who built it)"}]},
26:{title:"Reported Speech",tag:"Fluency · Day 26",concept:"When you report what someone said, the tense shifts back one step — as if you're retelling from further in the past. Direct quote → tense goes back. Time words shift too: now→then, today→that day, tomorrow→the next day.",pattern:`Direct speech → Reported speech:
"I am tired."     → She said she WAS tired.
"I will call."    → He said he WOULD call.
"I have finished."→ She said she HAD finished.
"I can help."     → He said he COULD help.
"I did it today." → She said she had done it THAT DAY.`,examples:[{w:"She said she will come tomorrow.",r:"She said she WOULD come THE NEXT DAY. (will→would, tomorrow→the next day)"},{w:"He told 'I am working on it.'",r:"He said he WAS working on it. (reported speech drops the quote marks, shifts tense)"}]},
27:{title:"Advanced Structures",tag:"Fluency · Day 27",concept:"These structures separate B2 from C1. Cleft sentences emphasize one element. Inversion creates dramatic effect. You've heard both constantly in anime. Now use them deliberately in your own speech.",pattern:`CLEFT (emphasis):
  Normal:  "I need more time."
  Cleft:   "What I need is more time."
  Cleft:   "It was hard work that got her the promotion."

INVERSION (dramatic/formal):
  Normal:  "I have never seen such courage."
  Inverted:"Never have I seen such courage!"
  Normal:  "He rarely shows emotion."
  Inverted:"Rarely does he show emotion."`,examples:[{w:"Never I have seen such talent.",r:"Never HAVE I seen such talent. (auxiliary comes before subject in inversion)"},{w:"I need your trust.",r:"More sophisticated: 'What I need is your trust.' (cleft sentence — emphasizes 'trust')"}]},
28:{title:"Self-Monitoring Techniques",tag:"Fluency · Day 28",concept:"Near-native speakers don't just know more — they SELF-CORRECT in real time without losing the flow of conversation. This is a learnable skill. Build the habit now and your improvement becomes self-sustaining.",pattern:`Weekly habit: Record yourself for 2 minutes on any topic.

  ✓ Right tense? (especially perfect tenses)
  ✓ Right stress? (word + sentence stress)
  ✓ Right register? (formal/casual for the situation)

29:{title:"Pronunciation Deep Dive",tag:"Fluency · Day 29",concept:"The final layer: the specific sounds and habits that mark a Gujarati-background speaker. Fix these and your spoken English becomes indistinguishable from near-native in most contexts.",pattern:`Gujarati-specific areas to target:

30:{title:"Final Integration",tag:"Mastery · Day 30",concept:"You've covered everything. Today is about integration — applying all 29 days together naturally, without thinking. Near-native fluency means the right form arrives automatically. Test yourself honestly: the quiz is at C1 level.",pattern:`What you've built in 30 days:

// ── APP STATE ──────────────────────────────────────────────────
let currentDay=1;
let quizQs=[];
let qIdx=0;
let answers=[];

// ── PROGRESS ──────────────────────────────────────────────────
function getP(){try{return JSON.parse(localStorage.getItem('em_p'))||{s:{},streak:0,last:null};}catch(e){return{s:{},streak:0,last:null};}}
function saveScore(day,score){
  const p=getP();
  p.s[day]=score;
  const today=new Date().toDateString();
  if(p.last!==today){
    const yest=new Date(Date.now()-86400000).toDateString();
    p.streak=p.last===yest?p.streak+1:1;
    p.last=today;
  }
  try{localStorage.setItem('em_p',JSON.stringify(p));}catch(e){}
}

// ── NAVIGATION ─────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ── DASHBOARD ──────────────────────────────────────────────────
function renderDash(){
  const p=getP();
  const scores=p.s||{};
  const done=Object.keys(scores).length;
  const vals=Object.values(scores);
  const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:'—';
  document.getElementById('stat-done').textContent=done;
  document.getElementById('stat-streak').textContent=p.streak||0;
  document.getElementById('stat-avg').textContent=avg==='—'?'—':avg+'/5';
  const grid=document.getElementById('day-grid');
  grid.innerHTML='';
  let nextDay=1;
  for(let i=1;i<=30;i++){
    const btn=document.createElement('button');
    btn.className='day-btn';
    btn.innerHTML='<span>'+i+'</span>';
    btn.title='Day '+i+': '+DAYS[i].title;
    btn.onclick=()=>showDay(i);
    if(scores[i]!==undefined){
      btn.className='day-btn '+(scores[i]>=4?'done-good':'done-ok');
      btn.title+=' ('+scores[i]+'/5)';
      if(i===done)nextDay=Math.min(30,i+1);
    } else if(i===done+1||(done===0&&i===1)){
      btn.classList.add('current');
      nextDay=i;
    }
    grid.appendChild(btn);
  }
  window._nextDay=nextDay;
}

function continueLearning(){showDay(window._nextDay||1);}

// ── DAY VIEW ───────────────────────────────────────────────────
function showDay(n){
  currentDay=n;
  const d=DAYS[n];
  document.getElementById('dv-tag').textContent=d.tag;
  document.getElementById('dv-title').textContent='Day '+n+': '+d.title;
  let html='<div class="concept-box">'+d.concept+'</div>';
  html+='<div class="pattern-box">'+d.pattern+'</div>';
  if(d.examples&&d.examples.length){
    d.examples.forEach(ex=>{
      html+='<div class="rw-pair"><div class="rw-wrong"><div class="rw-lbl w">❌ Avoid</div>'+ex.w+'</div><div class="rw-right"><div class="rw-lbl r">✓ Natural</div>'+ex.r+'</div></div>';
    });
  }
  const p=getP();
  if(p.s[n]!==undefined){
    html+='<div class="tip-box" style="margin-top:1rem">You scored <strong>'+p.s[n]+'/5</strong> on this quiz. Retake to beat your score!</div>';
  }
  document.getElementById('dv-body').innerHTML=html;
  showScreen('s-day');
}

// ── QUIZ ENGINE ────────────────────────────────────────────────
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startQuiz(day){
  const bank=QB[day];
  quizQs=shuffle(bank).slice(0,5);
  qIdx=0;
  answers=[];
  showScreen('s-quiz');
  renderQ();
}

function renderQ(){
  const q=quizQs[qIdx];
  const pct=((qIdx)/5)*100;
  document.getElementById('q-fill').style.width=pct+'%';
  document.getElementById('q-count').textContent='Question '+(qIdx+1)+' of 5';
  document.getElementById('q-text').textContent=q[0];
  const opts=document.getElementById('q-opts');
  opts.innerHTML='';
  const letters=['A','B','C','D'];
  q[1].forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML='<span class="opt-letter">'+letters[i]+'</span>'+opt;
    btn.onclick=()=>submitAnswer(i);
    opts.appendChild(btn);
  });
  document.getElementById('q-exp').style.display='none';
  document.getElementById('q-exp').textContent='';
  document.getElementById('next-wrap').style.display='none';
}

function submitAnswer(idx){
  const q=quizQs[qIdx];
  const correct=q[2];
  answers.push({q:q[0],selected:idx,correct:correct,opts:q[1],exp:q[3]});
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach((btn,i)=>{
    btn.disabled=true;
    if(i===correct)btn.classList.add('correct');
    if(i===idx&&idx!==correct)btn.classList.add('wrong');
  });
  const expEl=document.getElementById('q-exp');
  expEl.textContent=(idx===correct?'Correct! — ':'Incorrect. ')+q[3];
  expEl.style.display='block';
  document.getElementById('next-wrap').style.display='block';
}

function nextQ(){
  qIdx++;
  if(qIdx<5){renderQ();}else{showResults();}
}

function showResults(){
  const score=answers.filter(a=>a.selected===a.correct).length;
  saveScore(currentDay,score);
  document.getElementById('r-score').textContent=score;
  const msgs=['Keep going! Review Day '+currentDay+' again.','Good effort! Almost there.','Good! One more push.','Excellent! Almost perfect.','Perfect! You nailed it.'];
  const stars=['★☆☆☆☆','★★☆☆☆','★★★☆☆','★★★★☆','★★★★★'];
  document.getElementById('r-stars').textContent=stars[score];
  document.getElementById('r-msg').textContent=msgs[score];
  const wrong=answers.filter(a=>a.selected!==a.correct);
  let rev='';
  if(wrong.length){
    rev='<div class="review-title">Review these:</div>';
    wrong.forEach(a=>{
      rev+='<div class="review-item"><div class="review-q">'+a.q+'</div><div class="review-correct">✓ '+a.opts[a.correct]+'</div><div style="font-size:.8rem;color:var(--muted);margin-top:.2rem">'+a.exp+'</div></div>';
    });
  } else {
    rev='<div class="score-bar">100% — Outstanding! Move to the next day.</div>';
  }
  document.getElementById('r-review').innerHTML=rev;
  document.getElementById('q-fill').style.width='100%';
  showScreen('s-results');
  renderDash();
}

function retakeQuiz(){startQuiz(currentDay);}
function nextDay(){
  const next=Math.min(30,currentDay+1);
  showDay(next);
}

// ── THEME ──────────────────────────────────────────────────────
function toggleTheme(){
  const r=document.documentElement;
  const isDark=r.getAttribute('data-theme')==='dark';
  r.setAttribute('data-theme',isDark?'light':'dark');
  document.querySelectorAll('.theme-btn').forEach(b=>b.textContent=isDark?'🌙':'☀️');
  try{localStorage.setItem('em_theme',isDark?'light':'dark');}catch(e){}
}

// ── INIT ───────────────────────────────────────────────────────
(function(){
  try{
    const t=localStorage.getItem('em_theme');
    if(t){document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('.theme-btn').forEach(b=>b.textContent=t==='dark'?'☀️':'🌙');}
  }catch(e){}
  renderDash();
})();
</script>
